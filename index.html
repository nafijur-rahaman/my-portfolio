<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO — update these to match your portfolio.config.js -->
    <title>Md. Nafijur Rahaman — Full-Stack Developer</title>
    <meta
      name="description"
      content="Md. Nafijur Rahaman (Nafis) — full-stack developer building scalable web apps with React, Django REST and Node.js."
    />
    <meta name="author" content="Md. Nafijur Rahaman" />
    <meta name="theme-color" content="#f3f1ec" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Md. Nafijur Rahaman — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer building scalable web apps with React, Django REST and Node.js."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved light/dark mode before first paint to avoid a flash -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("portfolio-theme") || "{}");
        if (t.mode) document.documentElement.dataset.theme = t.mode;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
